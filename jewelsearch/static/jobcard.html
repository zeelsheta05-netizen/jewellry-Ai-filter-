<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Card · Design Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1f1a12; --muted: #6b5f4f; --line: #d9ccb0; --soft: #faf6ec; --tone: #8a6420;
  --sans: Manrope, system-ui, -apple-system, "Segoe UI", "Noto Sans Gujarati", sans-serif;
  --serif: Outfit, Manrope, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: #efe9dc; color: var(--ink); font: 13px/1.45 var(--sans); }
.bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); z-index: 2; }
.bar a { color: var(--tone); font-weight: 600; text-decoration: none; }
.bar button { font: 700 14px var(--sans); border: 1px solid var(--tone); background: linear-gradient(135deg, #fcf0cf, #eed18c); color: #5f400c; border-radius: 999px; padding: 9px 20px; cursor: pointer; }
.sheet { width: 210mm; max-width: calc(100vw - 32px); min-height: 297mm; margin: 20px auto; background: #fff; padding: 12mm; box-shadow: 0 10px 30px -18px rgba(60, 40, 10, .45); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.top h1 { margin: 0; font: 600 22px/1 var(--serif); letter-spacing: .18em; text-transform: uppercase; }
.top .shop { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.top .no { text-align: right; }
.top .no b { display: block; font: 600 26px/1 var(--serif); letter-spacing: .04em; }
.top .no span { font-size: 11px; color: var(--muted); }
.body { display: grid; grid-template-columns: 62mm 1fr; gap: 8mm; margin-top: 6mm; }
.pic { border: 1px solid var(--line); border-radius: 6px; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; background: #fff; }
.pic img { width: 100%; height: 100%; object-fit: contain; }
.pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2mm; margin-top: 2mm; }
.pics img { width: 100%; aspect-ratio: 1; object-fit: contain; border: 1px solid var(--line); border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: lining-nums tabular-nums; }
.kv td { border: 1px solid var(--line); padding: 5px 8px; vertical-align: top; }
.kv td:first-child { width: 40%; background: var(--soft); color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.kv td:last-child { font-weight: 700; font-size: 14px; }
h2 { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--tone); margin: 6mm 0 2mm; }
.grid td, .grid th { border: 1px solid var(--line); padding: 5px 8px; text-align: left; }
.grid th { background: var(--soft); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.grid td.num, .grid th.num { text-align: right; }
.grid td.num + td, .grid th.num + th { padding-left: 14px; }
.grid tfoot td { font-weight: 800; }
.work td { height: 11mm; }
.note { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; min-height: 14mm; font-size: 13.5px; }
.est { font-size: 11px; color: var(--muted); margin-top: 4mm; }
.signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8mm; margin-top: 12mm; }
.signs div { border-top: 1px solid var(--ink); padding-top: 4px; font-size: 11px; color: var(--muted); text-align: center; }
.state { text-align: center; padding: 80px 20px; color: var(--muted); }
@page { size: A4; margin: 0; }
@media print {
  body { background: #fff; }
  .bar { display: none; }
  .sheet { margin: 0; box-shadow: none; width: 210mm; max-width: none; min-height: auto; }
  h2, .grid, .work { break-inside: avoid; }
}
@media (max-width: 700px) {
  .sheet { padding: 16px; min-height: 0; }
  .body { grid-template-columns: 1fr; }
  .top { flex-direction: column; }
  .top .no { text-align: left; }
}
</style>
</head>
<body>
<div class="bar"><a href="/jeweler" id="back">‹ Back to the order</a><button type="button" id="print">Print job card</button></div>
<main class="sheet" id="sheet"><div class="state">Loading the job card…</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CAT = { ring: "Ring", earrings: "Earrings", pendant: "Pendant", necklace: "Necklace", bracelet: "Bracelet" };
const METAL = { rose_gold: "Rose gold", white_gold: "White gold", yellow_gold: "Yellow gold" };
const grams = n => `${(+n).toFixed(3).replace(/\.?0+$/, "")} g`;
const carats = n => n.toFixed(n < 0.1 ? 3 : 2);
const day = iso => new Date(iso).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });

const id = new URLSearchParams(location.search).get("id");
$("#print").addEventListener("click", () => window.print());

async function load() {
  if (!id || !/^\d+$/.test(id)) return fail("No order chosen.");
  $("#back").href = `/jeweler?id=${id}`;
  let res;
  try { res = await fetch(`/api/jeweler/orders/${id}`, { credentials: "same-origin" }); }
  catch { return fail("No connection. Check the network and try again."); }
  if (res.status === 401) return location.replace("/login?next=" + encodeURIComponent(location.pathname + location.search));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) return fail(data.detail || "This order can't be shown.");
  render(data.order);
}

function fail(msg) { $("#sheet").innerHTML = `<div class="state">${esc(msg)}</div>`; }

function render(o) {
  document.title = `Job card ${o.order_no} · Design Finder`;
  const snap = o.snapshot, sel = snap.selection, specs = snap.specs || {};
  const views = snap.design.views?.length ? snap.design.views : (o.thumb ? [o.thumb] : []);
  const est = snap.gold_source === "cad";
  const w = snap.gold_weight_g;
  const rows = [
    ["Design number", esc(o.design_id)],
    snap.brand ? ["Based on", `${esc(snap.brand.title)} (${esc(snap.brand.brand)})`] : null,
    ["Category", esc(CAT[o.category] || o.category)],
    specs.design_type ? ["Design type", esc(specs.design_type)] : null,
    ["Metal", `${esc(sel.purity_label)} (${esc(sel.fineness)}) ${esc(METAL[sel.metal] || sel.metal)}`],
    sel.ring_size ? ["Ring size", `IND ${sel.ring_size.in} · US ${sel.ring_size.us} · ${sel.ring_size.diameter_mm} mm`] : null,
    ["Quantity", `${sel.quantity} ${sel.quantity > 1 ? "pieces" : "piece"}`],
    ["Gold weight / piece", w != null ? `${est ? "≈ " : ""}${grams(w)}${est ? " (3D estimate)" : " (job card, after polish)"}` : "Not on file"],
    specs.ring_size && sel.ring_size && specs.ring_size.in !== sel.ring_size.in ? ["Designed at size", `IND ${specs.ring_size.in}`] : null,
    ...(specs.dimensions || []).map(d => [esc(d.label), esc(d.value)]),
    o.quote?.diamond_quality ? ["Diamond quality", esc(o.quote.diamond_quality)] : null,
  ].filter(Boolean);
  const st = specs.stones;
  let stones = `<p class="note">No stone details on file. Check the design file.</p>`;
  if (st && st.counted && st.count === 0) stones = `<p class="note">Plain metal design, no stones.</p>`;
  else if (st && st.groups?.length) {
    const hasSetting = st.groups.some(x => x.setting);
    stones = `<table class="grid"><thead><tr><th>Shape</th><th>Size</th>${st.counted ? `<th class="num">Pcs / piece</th><th class="num">Ct / piece</th>` : ""}${hasSetting ? "<th>Setting</th>" : ""}<th>Issued</th></tr></thead>
      <tbody>${st.groups.map(x => `<tr><td>${esc(x.shape)}</td><td>${esc(x.size)}</td>${st.counted ? `<td class="num">${x.count ?? "–"}</td><td class="num">${x.carat != null ? (st.source === "cad" ? "≈ " : "") + carats(x.carat) : "–"}</td>` : ""}${hasSetting ? `<td>${esc(x.setting)}</td>` : ""}<td></td></tr>`).join("")}</tbody>
      ${st.counted ? `<tfoot><tr><td colspan="2">Total per piece</td><td class="num">${st.count}</td><td class="num">${st.source === "cad" ? "≈ " : ""}${carats(st.carat)}</td>${hasSetting ? "<td></td>" : ""}<td></td></tr></tfoot>` : ""}
      </table>${!st.counted ? `<p class="est">Counts not known from the 3D file (it may hold one earring or the pair). Count from the design.</p>` : ""}`;
  }
  const steps = ["Casting", "Filing / assembly", "Setting", "Polish / rhodium", "Quality check"];
  $("#sheet").innerHTML = `
    <div class="top">
      <div><h1>Job card</h1><div class="shop">Design Finder · made to order</div></div>
      <div class="no"><b>${esc(o.order_no)}</b><span>Ordered ${esc(day(o.created_at))} · printed ${esc(day(new Date().toISOString()))}</span></div>
    </div>
    <div class="body">
      <div>
        <div class="pic">${views[0] ? `<img src="${esc(views[0])}" alt="${esc(o.design_id)}">` : ""}</div>
        ${views.length > 1 ? `<div class="pics">${views.slice(1, 4).map(v => `<img src="${esc(v)}" alt="">`).join("")}</div>` : ""}
      </div>
      <div><table class="kv"><tbody>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</tbody></table></div>
    </div>
    <h2>Diamonds</h2>${stones}
    <h2>Customer's instructions</h2><div class="note">${o.customer_note ? esc(o.customer_note) : "None."}</div>
    <h2>Workshop</h2>
    <table class="grid work"><thead><tr><th>Process</th><th>Karigar</th><th>Issue date</th><th class="num">Issue wt (g)</th><th class="num">Return wt (g)</th><th class="num">Loss (g)</th><th>Sign</th></tr></thead>
      <tbody>${steps.map(s => `<tr><td><b>${s}</b></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join("")}</tbody></table>
    ${est ? `<p class="est">≈ marks figures estimated from the 3D design file. Weigh the finished piece: the bill uses the actual weight.</p>` : ""}
    <div class="signs"><div>Prepared by</div><div>Checked by</div><div>Delivery due</div></div>`;
}

load();
</script>
</body>
</html>
